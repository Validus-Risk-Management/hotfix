[package]
name = "hotfix-http"
description = "HTTP endpoints and an optional web-based dashboard for the HotFIX engine"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
ui = ["dep:hotfix-dashboard"]

[dependencies]
hotfix = { version = "0.3.0", path = "../hotfix" }
hotfix-dashboard = { version = "0.1.0", path = "../hotfix-dashboard", optional = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
displaydoc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
